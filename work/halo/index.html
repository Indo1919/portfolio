/* styles/tokens.css */
:root {
  color-scheme: light dark;
  --brand-canvas: #F7F7F5;
  --brand-ink: #0A0A0A;
  --brand-signal: #FF4405;
  --brand-signal-deep: #C2360A;
  --brand-signal-tint: #FFEDE5;
  --brand-midnight: #0F1114;
  --brand-white: #FFFFFF;
  --font-sans: 'Geist', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --type-display-xl: 600 64px/64px var(--font-sans);
  --track-display-xl: -0.04em;
  --type-display: 600 44px/48px var(--font-sans);
  --track-display: -0.035em;
  --type-title-1: 600 28px/34px var(--font-sans);
  --track-title-1: -0.025em;
  --type-title-2: 600 21px/28px var(--font-sans);
  --track-title-2: -0.018em;
  --type-title-3: 600 17px/24px var(--font-sans);
  --track-title-3: -0.012em;
  --type-body-lg: 400 16px/24px var(--font-sans);
  --track-body-lg: -0.008em;
  --type-body: 400 14px/21px var(--font-sans);
  --track-body: -0.005em;
  --type-callout: 400 13px/19px var(--font-sans);
  --track-callout: -0.003em;
  --type-caption: 500 12px/16px var(--font-sans);
  --track-caption: 0.0em;
  --type-micro: 600 11px/14px var(--font-sans);
  --track-micro: 0.04em;
  --type-mono: 450 12px/16px var(--font-mono);
  --track-mono: 0.0em;
  --space-0: 0px;
  --space-1: 2px;
  --space-2: 4px;
  --space-3: 6px;
  --space-4: 8px;
  --space-5: 12px;
  --space-6: 16px;
  --space-7: 20px;
  --space-8: 24px;
  --space-9: 32px;
  --space-10: 40px;
  --space-11: 48px;
  --space-12: 64px;
  --space-13: 80px;
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 22px;
  --radius-full: 999px;
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --dur-slow: 320ms;
  --dur-page: 440ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
}
:root, :root[data-theme="light"] {
  --bg: #F7F7F5;
  --bg-sunken: #F1F1EE;
  --surface: #FFFFFF;
  --surface-2: #F4F4F1;
  --surface-3: #ECECE8;
  --border: #E6E6E1;
  --border-strong: #D5D5CF;
  --hairline: rgba(10,10,10,0.07);
  --text: #0A0A0A;
  --text-2: #4B4B47;
  --text-3: #6B6B66;
  --text-disabled: #A6A6A0;
  --accent: #FF4405;
  --accent-text: #C2360A;
  --accent-tint: #FFEDE5;
  --on-accent: #0A0A0A;
  --primary: #0A0A0A;
  --primary-hover: #2A2A28;
  --on-primary: #FFFFFF;
  --success: #12744A;
  --success-tint: #E6F3EC;
  --warning: #9A5B07;
  --warning-tint: #FBF1DE;
  --danger: #C0262D;
  --danger-tint: #FBEAEA;
  --info: #1D5BD8;
  --info-tint: #E9EFFC;
  --focus: #FF4405;
  --scrim: rgba(15,17,20,0.38);
  --selection: rgba(255,68,5,0.16);
  --shadow-1: 0 1px 2px rgba(10,10,10,0.04);
  --shadow-2: 0 10px 30px -10px rgba(10,10,10,0.18), 0 2px 6px -2px rgba(10,10,10,0.06);
  --shadow-3: 0 28px 70px -18px rgba(10,10,10,0.32), 0 6px 16px -6px rgba(10,10,10,0.10);
}
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1114;
    --bg-sunken: #0B0C0E;
    --surface: #16181C;
    --surface-2: #1C1F24;
    --surface-3: #25282E;
    --border: #262A30;
    --border-strong: #34383F;
    --hairline: rgba(255,255,255,0.07);
    --text: #F2F2EF;
    --text-2: #C3C4C0;
    --text-3: #9B9C98;
    --text-disabled: #5E6066;
    --accent: #FF4405;
    --accent-text: #FF6A38;
    --accent-tint: rgba(255,68,5,0.14);
    --on-accent: #0A0A0A;
    --primary: #F2F2EF;
    --primary-hover: #FFFFFF;
    --on-primary: #0A0A0A;
    --success: #4ADE80;
    --success-tint: rgba(74,222,128,0.12);
    --warning: #FBBF24;
    --warning-tint: rgba(251,191,36,0.12);
    --danger: #F87171;
    --danger-tint: rgba(248,113,113,0.12);
    --info: #60A5FA;
    --info-tint: rgba(96,165,250,0.12);
    --focus: #FF6A38;
    --scrim: rgba(0,0,0,0.56);
    --selection: rgba(255,106,56,0.24);
    --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-2: 0 12px 32px -8px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    --shadow-3: 0 30px 80px -16px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.07);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1114;
  --bg-sunken: #0B0C0E;
  --surface: #16181C;
  --surface-2: #1C1F24;
  --surface-3: #25282E;
  --border: #262A30;
  --border-strong: #34383F;
  --hairline: rgba(255,255,255,0.07);
  --text: #F2F2EF;
  --text-2: #C3C4C0;
  --text-3: #9B9C98;
  --text-disabled: #5E6066;
  --accent: #FF4405;
  --accent-text: #FF6A38;
  --accent-tint: rgba(255,68,5,0.14);
  --on-accent: #0A0A0A;
  --primary: #F2F2EF;
  --primary-hover: #FFFFFF;
  --on-primary: #0A0A0A;
  --success: #4ADE80;
  --success-tint: rgba(74,222,128,0.12);
  --warning: #FBBF24;
  --warning-tint: rgba(251,191,36,0.12);
  --danger: #F87171;
  --danger-tint: rgba(248,113,113,0.12);
  --info: #60A5FA;
  --info-tint: rgba(96,165,250,0.12);
  --focus: #FF6A38;
  --scrim: rgba(0,0,0,0.56);
  --selection: rgba(255,106,56,0.24);
  --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-2: 0 12px 32px -8px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
  --shadow-3: 0 30px 80px -16px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.07);
}
/* styles/base.css */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--text);
  font: var(--type-body); letter-spacing: var(--track-body);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  font-synthesis: none;
}
::selection { background: var(--selection); }

.item { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px; position: relative; width: 100%; text-align: left; }
.item + .item::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--hairline); }
.item.has-lead + .item.has-lead::before { left: 56px; }
.item-title { font: 500 14px/20px var(--font-sans); letter-spacing: -0.006em; color: var(--text); }
.item-sub { font: 400 13px/18px var(--font-sans); color: var(--text-3); }
.item-trail { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--text-3); flex: none; }
button.item:hover, a.item:hover, .item.clickable:hover { background: var(--surface-2); }
.item .lead-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); flex: none; }
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--hairline); }
.tab { position: relative; height: 40px; display: inline-flex; align-items: center; gap: 6px; font: 500 13.5px/1 var(--font-sans); color: var(--text-3); white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--text); border-radius: 2px; }
.tab .count-pill { margin-left: 2px; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; position: relative; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--text); transition: width var(--dur-slow) var(--ease-out); }
.bar.accent > span { background: var(--accent); }
.bar.success > span { background: var(--success); }
.bar.thin { height: 4px; }
.bar .over { position: absolute; top: 0; bottom: 0; background: var(--danger); }
.ring-svg { transform: rotate(-90deg); }
.ring-svg circle { fill: none; stroke-linecap: butt; transition: stroke-dashoffset var(--dur-slow) var(--ease-out); }
.layer { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.popover { position: fixed; z-index: 70; min-width: 200px; max-width: 340px; background: var(--surface); border-radius: 12px; padding: 5px;
  box-shadow: var(--shadow-2), 0 0 0 1px var(--border); animation: pop-in var(--dur-base) var(--ease-out); transform-origin: var(--origin, top left); pointer-events: auto; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border-radius: 7px; font: 400 13.5px/1 var(--font-sans); color: var(--text); text-align: left; }
.menu-item .i { color: var(--text-2); }
.menu-item:hover, .menu-item.is-hot { background: var(--surface-2); }
.menu-item .trail { margin-left: auto; color: var(--text-3); font-size: 12px; display: flex; gap: 2px; align-items: center; }
.menu-item.danger, .menu-item.danger .i { color: var(--danger); }
.menu-item[aria-checked="true"] .check-mark { opacity: 1; }
.menu-item .check-mark { opacity: 0; margin-left: auto; color: var(--text); }
.menu-sep { height: 1px; background: var(--hairline); margin: 5px 6px; }
.menu-label { font: 600 11px/1 var(--font-sans); color: var(--text-3); padding: 10px 10px 6px; letter-spacing: .02em; }
[data-tip] { position: relative; }
.tooltip { position: fixed; z-index: 90; pointer-events: none; padding: 6px 9px; border-radius: 7px; max-width: 260px;
  font: 500 12px/16px var(--font-sans); letter-spacing: -0.003em; color: var(--surface); background: var(--text);
  animation: fade-in var(--dur-fast) var(--ease); }
.tooltip .kbd { background: color-mix(in srgb, var(--surface) 18%, transparent); color: var(--surface); box-shadow: none; margin-left: 6px; }
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); animation: fade-in var(--dur-base) var(--ease); }
.scrim.clear { background: transparent; }
.modal { position: fixed; z-index: 55; left: 50%; top: 50%; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 64px); max-height: calc(100dvh - 64px);
  transform: translate(-50%, -50%); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-3), 0 0 0 1px var(--border);
  display: flex; flex-direction: column; overflow: hidden; animation: modal-in var(--dur-slow) var(--ease-out); }
.modal.wide { width: min(760px, calc(100vw - 32px)); }
.modal.narrow { width: min(420px, calc(100vw - 32px)); }
.modal-hd { display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 4px 24px; }
.modal-hd h2 { font: 600 18px/24px var(--font-sans); letter-spacing: -0.016em; }
.modal-hd p { color: var(--text-3); font: var(--type-callout); margin-top: 4px; }
.modal-bd { padding: 16px 24px 20px; overflow: auto; }
.modal-ft { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--hairline); background: var(--surface); }
.sheet { position: fixed; z-index: 55; top: 8px; right: 8px; bottom: 8px; width: min(520px, calc(100vw - 16px)); background: var(--surface); border-radius: 16px;
  box-shadow: var(--shadow-3), 0 0 0 1px var(--border); display: flex; flex-direction: column; overflow: hidden; animation: sheet-in var(--dur-slow) var(--ease-out); }
.sheet.wide { width: min(720px, calc(100vw - 16px)); }
.sheet-hd { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--hairline); flex: none; }
.sheet-bd { flex: 1; overflow: auto; }
.sheet-ft { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--hairline); flex: none; }
.is-closing { animation: fade-out var(--dur-fast) var(--ease-in) forwards !important; }
.toasts { position: fixed; z-index: 95; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column-reverse; gap: 8px; align-items: center; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 8px 8px 14px; border-radius: 12px; max-width: min(520px, calc(100vw - 32px));
  background: var(--text); color: var(--surface); font: 500 13px/18px var(--font-sans); box-shadow: var(--shadow-2); animation: toast-in var(--dur-slow) var(--ease-out); pointer-events: none; }
.toast .i { color: color-mix(in srgb, var(--surface) 75%, transparent); }
.toast .i.ok { color: #4ADE80; }
.toast button { pointer-events: auto; height: 26px; padding: 0 10px; border-radius: 7px; font: 600 12.5px/1 var(--font-sans); color: var(--surface); background: color-mix(in srgb, var(--surface) 14%, transparent); }
.toast button:hover { background: color-mix(in srgb, var(--surface) 22%, transparent); }
.toast.out { animation: toast-out var(--dur-base) var(--ease-in) forwards; }
.banner { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: var(--radius-lg); background: var(--surface-2); color: var(--text-2); font: var(--type-callout); }
.banner .i { margin-top: 1px; flex: none; }
.banner strong { color: var(--text); font-weight: 600; }
.banner-accent { background: var(--accent-tint); color: color-mix(in srgb, var(--accent-text) 80%, var(--text)); }
.banner-accent .i { color: var(--accent-text); }
.banner-info { background: var(--info-tint); } .banner-info .i { color: var(--info); }
.banner-warning { background: var(--warning-tint); } .banner-warning .i { color: var(--warning); }
.banner-success { background: var(--success-tint); } .banner-success .i { color: var(--success); }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 48px 24px; gap: 6px; }
.empty-art { width: 64px; height: 64px; margin-bottom: 10px; color: var(--text-3); display: grid; place-items: center; border-radius: 18px; background: var(--surface-2); }
.empty h3 { font: 600 16px/22px var(--font-sans); letter-spacing: -0.012em; }
.empty p { color: var(--text-3); max-width: 360px; font: var(--type-callout); }
.skeleton { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 6px; }
.src { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px 0 4px; border-radius: 6px; background: var(--surface-2);
  font: 500 11.5px/1 var(--font-sans); color: var(--text-2); white-space: nowrap; box-shadow: inset 0 0 0 1px var(--hairline); }
.src .bm { width: 14px; height: 14px; }
.src > span { line-height: 16px; }
button.src:hover { color: var(--text); background: var(--surface-3); }
.key { font: 500 12px/1 var(--font-mono); color: var(--text-3); letter-spacing: 0; white-space: nowrap; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes pop-in { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
@keyframes modal-in { from { opacity: 0; transform: translate(-50%, calc(-50% + 12px)) scale(.98); } }
@keyframes sheet-in { from { opacity: 0; transform: translateX(24px); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(.97); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 45%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes blink { 50% { opacity: 0; } }
.rise { animation: rise var(--dur-slow) var(--ease-out) both; }
.rise-1 { animation-delay: 40ms; } .rise-2 { animation-delay: 80ms; } .rise-3 { animation-delay: 120ms; } .rise-4 { animation-delay: 160ms; } .rise-5 { animation-delay: 200ms; }
/* styles/shell.css */
:root { --sidebar-w: 244px; --gutter: 8px; }
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }
.sidebar { display: flex; flex-direction: column; min-height: 0; padding: 10px 10px 10px 12px; gap: 2px; }
.ws-row { display: flex; align-items: center; gap: 2px; margin-bottom: 6px; }
.ws { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 10px; border-radius: 10px; flex: 1; min-width: 0; text-align: left; }
.ws-logo { margin-left: 8px; transition: transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease); }
.ws-logo svg { transition: transform 520ms var(--ease-out); }
.ws-logo:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
.ws-logo:hover svg, .ws-logo:focus-visible svg { transform: rotate(-90deg); }   
.ws-logo:active { transform: scale(0.94); }
.ws:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.ws-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--brand-ink); display: grid; place-items: center; flex: none; }
:root[data-theme="dark"] .ws-mark { background: #25282E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ws-mark { background: #25282E; } }
.ws-name { font: 600 14px/18px var(--font-sans); letter-spacing: -0.012em; }
.ws-sub { font: 400 12px/16px var(--font-sans); color: var(--text-3); }
.side-search { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px; border-radius: 8px; color: var(--text-3); width: 100%;
  background: var(--surface); box-shadow: 0 0 0 1px var(--border); font: 400 13px/1 var(--font-sans); margin-bottom: 10px; }
.side-search:hover { color: var(--text-2); box-shadow: 0 0 0 1px var(--border-strong); }
.side-search .kbd { margin-left: auto; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-label { font: 600 11.5px/1 var(--font-sans); color: var(--text-3); padding: 16px 10px 8px; letter-spacing: 0; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px 0 10px; border-radius: 8px; width: 100%; text-align: left;
  font: 500 13.5px/1 var(--font-sans); letter-spacing: -0.006em; color: var(--text-2); position: relative;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.nav-item .i { color: var(--text-3); transition: color var(--dur-fast) var(--ease); }
.nav-item:hover { background: color-mix(in srgb, var(--text) 5%, transparent); color: var(--text); }
.nav-item:hover .i { color: var(--text-2); }
.nav-item[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border), 0 1px 2px rgba(10,10,10,.04); }
.nav-item[aria-current="page"] .i { color: var(--text); }
.nav-item .trail { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.nav-item .count { font: 500 11.5px/1 var(--font-mono); color: var(--text-3); }
.side-spacer { flex: 1; min-height: 16px; }
.trust { border-radius: 12px; padding: 12px; background: var(--surface); box-shadow: 0 0 0 1px var(--border); margin-bottom: 8px; }
.trust-hd { display: flex; align-items: center; gap: 8px; font: 500 12px/16px var(--font-sans); color: var(--text-3); }
.trust-hd strong { color: var(--text); font-weight: 600; }
.trust-track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 10px; padding: 2px; background: var(--surface-3); border-radius: 8px; }
.trust-stop { height: 24px; border-radius: 6px; font: 500 11.5px/1 var(--font-sans); color: var(--text-3); transition: all var(--dur-base) var(--ease); }
.trust-stop:hover { color: var(--text); }
.trust-stop[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(10,10,10,.1); }
:root[data-theme="dark"] .trust-stop[aria-pressed="true"] { background: #33373E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .trust-stop[aria-pressed="true"] { background: #33373E; } }
.trust-note { font: 400 12px/16px var(--font-sans); color: var(--text-3); margin-top: 8px; }
.me { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px; border-radius: 10px; width: 100%; text-align: left; }
.me:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.me-name { font: 500 13px/16px var(--font-sans); }
.me-sub { font: 400 12px/16px var(--font-sans); color: var(--text-3); }
.main { margin: var(--gutter) var(--gutter) var(--gutter) 0; background: var(--surface); border-radius: 14px;
  box-shadow: 0 0 0 1px var(--border), 0 1px 3px rgba(10,10,10,.03); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
.topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--hairline);
  background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); z-index: 5; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font: 500 13.5px/1 var(--font-sans); color: var(--text-3); letter-spacing: -0.006em; }
.crumbs a:hover, .crumbs button:hover { color: var(--text); }
.crumbs .here { color: var(--text); font-weight: 600; }
.crumbs .sep { color: var(--border-strong); }
.topbar .actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.bell-dot { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.content { flex: 1; overflow: auto; overscroll-behavior: contain; position: relative; }
.page { max-width: 1120px; margin: 0 auto; padding: 28px 40px 72px; }
.page.wide { max-width: 1320px; }
.page.full { max-width: none; padding: 0; height: 100%; }
.page.narrow { max-width: 760px; }
.page-hd { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.page-hd h1 { font: var(--type-title-1); letter-spacing: var(--track-title-1); }
.page-hd .lede { color: var(--text-3); font: var(--type-body); margin-top: 6px; max-width: 620px; }
.page-hd .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.screen-enter { animation: screen-in var(--dur-page) var(--ease-out) both; }
@keyframes screen-in { from { opacity: 0; transform: translateY(6px); } }
.mbar { display: none; }
.tabbar { display: none; }
.palette { position: fixed; z-index: 80; left: 50%; top: 14vh; width: min(640px, calc(100vw - 24px)); transform: translateX(-50%);
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-3), 0 0 0 1px var(--border); overflow: hidden; animation: pop-in var(--dur-base) var(--ease-out); }
.palette-in { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--hairline); }
.palette-in input { flex: 1; border: 0; background: transparent; font: 400 16px/1 var(--font-sans); letter-spacing: -0.01em; height: 100%; }
.palette-in input:focus { outline: none; }
.palette-list { max-height: min(420px, 56vh); overflow: auto; padding: 6px; }
.palette-group { font: 600 11.5px/1 var(--font-sans); color: var(--text-3); padding: 12px 10px 6px; }
.palette-item { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 9px; width: 100%; text-align: left; font: 400 14px/1 var(--font-sans); color: var(--text); }
.palette-item .i { color: var(--text-3); }
.palette-item .sub { color: var(--text-3); font-size: 12.5px; margin-left: 4px; }
.palette-item .trail { margin-left: auto; display: flex; gap: 2px; color: var(--text-3); font-size: 12px; }
.palette-item.is-hot { background: var(--surface-2); }
.palette-item.is-hot .i { color: var(--text); }
.palette-ft { display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 16px; border-top: 1px solid var(--hairline); color: var(--text-3); font: 400 12px/1 var(--font-sans); }
.palette-ft span { display: inline-flex; align-items: center; gap: 6px; }
.notif { display: flex; gap: 12px; padding: 14px 20px; position: relative; width: 100%; text-align: left; }
.notif:hover { background: var(--surface-2); }
.notif + .notif { border-top: 1px solid var(--hairline); }
.notif .unread { position: absolute; left: 8px; top: 22px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.notif-title { font: 500 13.5px/19px var(--font-sans); }
.notif-body { font: 400 13px/18px var(--font-sans); color: var(--text-3); margin-top: 2px; }
.notif-time { font: 400 12px/16px var(--font-sans); color: var(--text-3); margin-top: 6px; }
.paused-strip { display: flex; align-items: center; justify-content: center; gap: 10px; height: 36px; flex: none; background: var(--warning-tint); color: var(--warning);
  font: 500 12.5px/1 var(--font-sans); border-bottom: 1px solid var(--hairline); }
.paused-strip button { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 1080px) {
  .page { padding: 24px 28px 64px; }
}
@media (max-width: 960px) and (min-width: 761px) {
  :root { --sidebar-w: 64px; }
  .sidebar { padding: 10px 8px; align-items: center; }
  .ws-row { justify-content: center; }
  .ws-row .ws { display: none; }
  .ws-logo { margin: 8px 0; }
  .side-search { width: 44px; justify-content: center; padding: 0; }
  .side-search > :not(.i) { display: none; }
  .nav-item { width: 44px; justify-content: center; padding: 0; }
  .nav-item > :not(.i):not(.trail) { display: none; }
  .nav-item .trail { position: absolute; top: 3px; right: 3px; }
  .nav-item .trail .count { display: none; }
  .nav-label { display: none; }
  .trust { display: none; }
  .me { width: 44px; padding: 0; justify-content: center; }
  .me > :not(.avatar) { display: none; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .sidebar { display: none; }
  .sidebar.is-open { display: flex; position: fixed; z-index: 58; top: 0; left: 0; bottom: 0; width: min(300px, 86vw); background: var(--bg); box-shadow: var(--shadow-3); animation: drawer-in var(--dur-slow) var(--ease-out); overflow: auto; }
  .main { margin: 0; border-radius: 0; box-shadow: none; }
  .topbar { display: none; }
  .mbar { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 8px; padding-top: env(safe-area-inset-top); flex: none; border-bottom: 1px solid var(--hairline);
    background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); z-index: 5; }
  .mbar .title { font: 600 16px/1 var(--font-sans); letter-spacing: -0.014em; margin-left: 4px; min-width: 0; }
  .mbar .actions { margin-left: auto; display: flex; gap: 2px; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); flex: none; height: calc(58px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);

}
@media (max-width: 760px) {

  .stg-mode-name { order: 2; }
  .stg-mode-note { order: 4; width: 100%; }
  .stg-themes { gap: 8px; }
  .stg-theme { padding: 6px 6px 10px; gap: 10px; }
  .stg-theme-label { padding: 0 2px; gap: 8px; }
  .stg-theme-label .item-sub { display: none; }
  .stg-ctl { max-width: 58%; }
  .stg-input { width: 100%; }
  .stg-select { min-width: 0; }
  .stg-range { flex-wrap: wrap; justify-content: flex-end; }
  .stg-kb { grid-template-columns: minmax(0, 1fr); }
  .stg-kb > div + div > .stg-sec:first-child { margin-top: 28px; }
  .stg-key-row { flex-wrap: nowrap; }
  .stg-sends-list { padding-left: 16px; }
  .stg-sends-never { margin-left: 16px; }
  .stg-ai { flex-wrap: wrap; padding: 16px; }
  .stg-ai > .grow { flex: 1 1 calc(100% - 24px); }
  .stg-ai > .btn { margin-left: 24px; }
  .stg-stack { flex-wrap: wrap; }
  .stg-stack > .grow { flex-basis: 100%; }
  .stg-stack > .stg-ctl { max-width: none; width: 100%; }
  .stg-stack .stg-range { justify-content: flex-start; flex-wrap: nowrap; }
  .stg-stack .stg-range .stg-select { flex: 1; }
}

        { who: 'maya', text: 'Declined, expired and 3DS flows ready for review', when: mayaDay },
        { who: 'priya', text: 'Error copy, written with the Content team', when: null },

        ['01:48', 'leo', 'And 3D Secure failures. A lot of those are timeouts, which is what CHK-150 is about.'],
        ['02:31', 'sam', 'Can we keep errors inline on the payment step? A separate error page loses the cart on mobile.'],
        ['02:55', 'maya', 'Agreed. Inline, next to the field that needs fixing, with one clear next step.'],
        ['03:40', 'priya', 'So, decision: declined, expired and 3DS first. Outages and fraud holds come later.'],
        ['04:18', 'leo', 'I’ll map the processor codes to buyer-facing states. There are dozens of codes, but they collapse into a handful.'],
        ['05:02', 'priya', 'Copy should name the fix, not the code. I’ll bring in Content for the wording.'],
        ['05:36', 'hana', 'I’ll add error events to the funnel so we can see which states people recover from.'],
        ['06:10', 'sam', 'Open question: after a 3DS timeout, do we retry automatically or ask the buyer?'],
        ['06:32', 'leo', 'Depends on what the processor allows. I’ll know once I have sandbox access.'],
        ['07:15', 'priya', 'One more for later: should merchants see decline reasons in their dashboard? I’ll ask Support.'],
        ['07:58', 'maya', 'I can have the declined, expired and 3DS flows ready for review by ' + mayaDay + '.'],
        ['08:20', 'leo', 'I’ll have the code map to you before then, so the flows use the real states.'],
        ['08:44', 'priya', 'Perfect. Let’s review the flows together then.']

  }
  function transcriptText() { return content().transcript.map(function (l) { return (q.person(l[1]) || { name: l[1] }).name + ': ' + l[2]; }).join('\n'); }
  function fromAi(j) {
    return {
      title: String(j.title || 'Checkout error and recovery states'), summary: String(j.summary || ''),
      rows: (j.subtasks || []).map(function (s) {
        var o = Math.max(0, +s.o || 1), m = Math.max(o, +s.m || 2), p = Math.max(m, +s.p || 3);
        return { id: U.uid('rs'), title: String(s.title || ''), owner: OWNERS.indexOf(s.owner) >= 0 ? s.owner : 'maya', o: o, m: m, p: p, on: true };
      })
    };
  }
  function draft() { if (!view.draft) view.draft = fromAi(H.ai.demoDecompose()); return view.draft; }
  function estOf(r) { return { est: { o: +r.o || 0, m: +r.m || 0, p: +r.p || 0 } }; }

  /* ---------- Pieces ---------- */
  function header(ev) {

      '<div class="actions">' + ui.btn('Open in calendar', { icon: 'calendar', action: 'nav', attrs: { 'data-to': '#/calendar?e=' + ev.id } }) + '</div></header>';

  function parentBlock(d) {
    var due = H.at(H.bday(2, '17:00')), me = q.me();

      '<label class="sr-only" for="rc-ptitle">Ticket title</label><input id="rc-ptitle" class="rc-ptitle" value="' + esc(d.title) + '" data-input="rc-ptitle" placeholder="Name the ticket" autocomplete="off">' +

        '<span class="rc-prop" data-tip="' + esc(F.dateLong(due)) + '">' + H.icon('calendar', 14) + 'Due ' + F.day(due) + '</span><span class="rc-prop">' + ui.avatar(me, 'xs', { tip: false }) + esc(me.name) + '</span></div>' +
      (d.summary ? '<p class="rc-psum">' + esc(d.summary) + '</p>' : '') + '</div>';
  }
  function table(d) {
    var head = '<div class="rc-tr rc-th" role="row"><span role="columnheader" class="rc-c-chk"><span class="sr-only">Include</span></span><span role="columnheader" class="rc-c-title">Subtask</span>' +
      '<span role="columnheader" class="rc-c-owner">Owner</span><span role="columnheader" class="rc-c-est" data-tip="Best case, likely and worst case, in hours">Best · Likely · Worst</span><span role="columnheader" class="rc-c-exp">Expected</span></div>';
    var rows = d.rows.map(function (r, i) {
      var p = q.person(r.owner) || q.me(), e = U.pert(r.o, r.m, r.p), label = r.title || 'this subtask';
      return '<div class="rc-tr' + (r.on ? '' : ' is-off') + '" role="row" data-key="rc-' + r.id + '">' +
        '<span role="cell" class="rc-c-chk">' + ui.check(r.on, 'rc-inc', { 'data-i': i, 'aria-label': 'Include ' + label }, 'square') + '</span>' +
        '<span role="cell" class="rc-c-title"><input class="rc-in" id="rc-in-' + r.id + '" value="' + esc(r.title) + '" data-input="rc-sub-title" data-i="' + i + '" aria-label="Subtask ' + (i + 1) + '" placeholder="Describe the subtask" autocomplete="off"></span>' +
        '<span role="cell" class="rc-c-owner"><button type="button" class="rc-owner" data-action="rc-owner" data-i="' + i + '" aria-haspopup="menu" aria-label="Owner: ' + esc(p.name) + '. Reassign">' + ui.avatar(p, 'xs', { tip: false }) + '<span class="truncate">' + esc(p.name.split(' ')[0]) + '</span>' + H.icon('chevron-down', 12, 'rc-caret') + '</button></span>' +
        '<span role="cell" class="rc-c-est">' + ['o', 'm', 'p'].map(function (f) {
          return '<input class="rc-num" inputmode="decimal" value="' + numIn(r[f]) + '" data-input="rc-est" data-i="' + i + '" data-f="' + f + '" aria-label="' + ({ o: 'Best case', m: 'Likely', p: 'Worst case' })[f] + ' hours for ' + esc(label) + '">';
        }).join('') + '</span>' +
        '<span role="cell" class="rc-c-exp num" data-tip="(best + 4 × likely + worst) ÷ 6">' + one(e.mean) + '</span></div>';
    }).join('');
    return '<div class="rc-table" role="table" aria-label="Drafted subtasks">' + head + rows + '</div>' +
      '<button type="button" class="rc-add" data-action="rc-add">' + H.icon('plus', 14) + 'Add a subtask</button>';
  }
  function totals(d) {
    var me = H.store.state.me, inc = d.rows.filter(function (r) { return r.on; }), roll = U.rollup(inc.map(estOf));
    var mine = inc.filter(function (r) { return r.owner === me; }), share = U.rollup(mine.map(estOf)).mean * q.pace();
    var c = q.capacity(), over = share - c.free, people = inc.map(function (r) { return r.owner; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
    var ds = q.ticket('DS-212'), move = ds && ds.owner === me && ds.status !== 'done' ? ds : q.myTickets().filter(function (t) { return t.status !== 'done' && t.prio === 'low'; })[0];
    var verdict;
    if (!mine.length) verdict = '<p class="rc-verdict">' + H.icon('info', 14) + '<span>Nothing here is assigned to you.</span></p>';
    else if (over <= 0.25) verdict = '<p class="rc-verdict is-ok">' + H.icon('check-circle', 14) + '<span><b>Fits this week</b>, with about ' + F.hours(-over) + ' of focus time to spare.</span></p>';
    else verdict = '<p class="rc-verdict is-warn">' + H.icon('alert', 14) + '<span><b>About ' + F.hours(over) + ' over</b> your ' + F.hours(c.free) + ' of focus time left this week.' +
      (move ? ' Consider moving <span class="key">' + esc(move.key) + '</span>, or give a subtask to a teammate.' : ' Consider giving a subtask to a teammate.') + '</span></p>';
    return '<div class="rc-sum">' +
      '<div class="rc-sum-cell"><div class="rc-sum-k">Team total</div><div class="rc-sum-v">' + (inc.length ? 'About ' + F.hours(roll.mean) : 'Nothing selected') + '</div>' +
        (inc.length ? '<div class="rc-sum-s">' + U.plural(inc.length, 'subtask') + ', ' + U.plural(people.length, 'person', 'people') + ' · usually ' + F.hours(roll.low) + '–' + F.hours(roll.high) + ', 85% within ' + F.hours(roll.p85) + '</div>' : '') + '</div>' +
      '<div class="rc-sum-cell"><div class="rc-sum-k">Your share</div><div class="rc-sum-v">' + (mine.length ? 'About ' + F.hours(share) + ' <span class="rc-sum-at">at your pace</span>' : '0h') + '</div>' + verdict + '</div></div>';
  }
  function skeleton() {
    return '<div class="rc-parent" aria-busy="true"><span class="skeleton" style="display:block;width:96px;height:10px"></span><span class="skeleton" style="display:block;width:58%;height:22px;margin-top:14px"></span><span class="skeleton" style="display:block;width:84%;height:12px;margin-top:16px"></span></div>' +
      '<div class="rc-table" aria-hidden="true">' + [72, 58, 80, 64, 50, 68].map(function (w) {
        return '<div class="rc-tr rc-skel"><span class="skeleton" style="width:16px;height:16px;border-radius:4px"></span><span class="skeleton" style="width:' + w + '%;height:12px"></span><span class="skeleton rc-skel-o" style="width:64px;height:12px"></span><span class="skeleton rc-skel-e" style="width:120px;height:12px"></span><span class="skeleton rc-skel-x" style="width:36px;height:12px"></span></div>';
      }).join('') + '</div>' +

  function notesPanel() {
    return '<div class="rc-notes"><label for="rc-notes" class="label">Your notes</label>' +
      '<textarea id="rc-notes" class="textarea" rows="5" placeholder="Paste your own notes from the meeting. Halo drafts the ticket and subtasks from them instead of the transcript." data-input="rc-notes-in" data-mod-enter="rc-notes-go">' + esc(view.notes) + '</textarea>' +
      '<div class="rc-notes-ft"><span class="hint grow">' + H.icon('lock', 12) + ' Your notes stay in your Halo.</span>' + ui.btn('Cancel', { kind: 'ghost', size: 'sm', action: 'rc-notes' }) +
        ui.btn('Draft from my notes', { size: 'sm', icon: 'sparkle', action: 'rc-notes-go', disabled: !view.notes.trim() || view.loading }) + '</div></div>';
  }
  function hero(ev) {
    var t = created(); if (t) return successCard(t);
    var d = draft(), n = d.rows.filter(function (r) { return r.on && r.title.trim(); }).length;
    var body = view.loading ? skeleton() : parentBlock(d) + (view.error ? '<div class="banner banner-warning rc-err">' + H.icon('alert', 16) + '<span class="grow">Halo couldn’t draft a new version just now. Your current draft is unchanged.</span>' + ui.btn('Try again', { size: 'xs', action: view.fromNotes ? 'rc-notes-go' : 'rc-regen' }) + '</div>' : '') + table(d) + totals(d);
    return '<section class="card rc-hero" aria-label="Drafted ticket and subtasks">' +

        ui.btn(n ? 'Create 1 ticket + ' + U.plural(n, 'subtask') : 'Create 1 ticket', { kind: 'primary', icon: 'plus', action: 'rc-create', disabled: view.loading || !d.title.trim() }) + '</div></section>';
  }
  function successCard(t) {
    var me = H.store.state.me, subs = t.subtasks || [];
    var others = subs.map(function (s) { return s.owner || t.owner; }).filter(function (v, i, a) { return v !== me && a.indexOf(v) === i; });
    var mine = subs.filter(function (s) { return (s.owner || t.owner) === me && !s.done; }), mineH = U.rollup(mine).mean * q.pace();

      '<p class="rc-done-sub">' + U.plural(subs.length, 'subtask') + (others.length ? ', with ' + esc(firstNames(others)) + ' owning theirs' : '') + '. Due ' + (t.due != null ? F.day(H.at(t.due)) : 'whenever you decide') + '.</p></div></div>' +
      '<ul class="rc-done-list">' + subs.map(function (s) {
        var o = q.person(s.owner || t.owner);
        return '<li>' + ui.status(s.done ? 'done' : 'todo', false) + '<span class="grow truncate">' + esc(s.title) + '</span><span class="rc-done-h num">' + (s.est ? one(U.pert(s.est.o, s.est.m, s.est.p).mean) : '') + '</span>' + ui.avatar(o, 'xs') + '</li>';
      }).join('') + '</ul>' +
      '<div class="rc-done-ft"><span class="hint grow">' + (mine.length ? 'Your part is about ' + F.hours(mineH) + ' at your pace.' : 'None of the subtasks are yours.') + '</span>' +

  function recapCard(c) {

  /* ---------- Actions ---------- */
  function regenerate(text, fromNotes) {
    if (view.loading || !String(text || '').trim()) return;
    view.loading = true; view.error = false; view.fromNotes = !!fromNotes; H.render();
    H.ai.decompose(text).then(function (j) {
      if (!j || !j.subtasks || !j.subtasks.length) throw { code: 'empty' };
      view.loading = false; view.draft = fromAi(j); view.live = !!j.live; if (fromNotes) view.notesOpen = false;
      H.render(); ui.toast(fromNotes ? 'Drafted from your notes' : 'Halo drafted a fresh version', { icon: 'sparkle' });
    }).catch(function () { view.loading = false; view.error = true; H.render(); });
  }
  function row(el) { return draft().rows[+el.dataset.i]; }
  var actions = {
    'rc-ptitle': function (el) { var d = draft(), had = !!d.title.trim(); d.title = el.value; if (had !== !!d.title.trim()) H.render(); },

    'rc-est': function (el) { var r = row(el), v = parseFloat(el.value); if (!r || isNaN(v) || v < 0) return; r[el.dataset.f] = Math.min(v, 999); H.render(); },
    'rc-inc': function (el) { var r = row(el); if (r) { r.on = !r.on; H.render(); } },
    'rc-owner': function (el) {

        return { lead: ui.avatar(p, 'xs', { tip: false }), text: p.name + (id === H.store.state.me ? ' (you)' : ''), hint: p.role.split(',')[0].replace('Senior ', '').replace('Staff ', ''), action: 'rc-owner-set', attrs: { 'data-i': i, 'data-v': id, role: 'menuitemradio' }, checked: r.owner === id };
      })), { width: 300 });

      var c = content();

      H.store.commit(function (s) { s.recaps = s.recaps || {}; s.recaps.kickoff = Object.assign({}, s.recaps.kickoff, { shared: true }); });
    },
    'rc-create': function () {
      var d = draft(), me = H.store.state.me, ev = kickoff(), c = content();
      if (!d.title.trim()) { var ti = document.getElementById('rc-ptitle'); if (ti) ti.focus(); return; }
      var inc = d.rows.filter(function (r) { return r.on && r.title.trim(); }), roll = U.rollup(inc.map(estOf));
      var t = H.act.createTicket({
        title: d.title.trim(), project: 'CHK', prio: 'high', due: H.bday(2, '17:00'),

  H.screens.recap = {
    title: 'Recap',
    docTitle: function () { return 'Recap · ' + kickoff().title + ' · Halo'; },
    crumbs: function () { return [{ label: 'Calendar', nav: '#/calendar' }, { label: 'Recap' }]; },

            return '<div class="ob-slider"><span>' + x[1] + '</span><input type="range" min="0" max="100" value="' + t[x[0]] + '" data-input="ob-tone" data-k="' + x[0] + '" aria-label="' + x[1] + ' to ' + x[2] + '"><span>' + x[2] + '</span></div>';
          }).join('') + '</div>' +
          '<div class="card ob-preview mt-4"><span class="kicker">' + ui.mark(14) + '<span>How you’ll sound</span></span><p id="ob-prev">' + esc(voicePreview()) + '</p></div>';
      case 'boundaries':
        return head('Set your boundaries', 'Anything that touches these topics is dropped before a draft exists. When Halo holds something back, it tells you.') +
          '<div class="group-title">Private topics</div><div class="group">' + s.privacy.topics.map(function (tp) {
            return '<div class="item"><span class="grow"><span class="item-title" style="display:block">' + esc(tp.label) + '</span><span class="item-sub">' + esc(tp.hint) + '</span></span>' + ui.switch(tp.on, 'ob-topic', { 'data-id': tp.id, 'aria-label': tp.label }) + '</div>';
          }).join('') + '</div>' +
          '<div class="group-title mt-6">Never share</div><div class="group">' + [['dm', 'Direct messages'], ['private', 'Events marked private'], ['oneonone', 'Anything from 1:1s']].map(function (r) {
            return '<div class="item"><span class="grow item-title">' + r[1] + '</span><span class="badge">' + H.icon('lock', 12) + 'Always</span></div>';
          }).join('') + '</div>' +
          '<div class="banner mt-5"><span class="redacted-chip"><span class="bars"><i></i><i></i></span>Redacted: 1 private topic</span><span>This is what visible restraint looks like. Only you see what was held back.</span></div>';
      case 'digest':
        var cur = s.prefs.digestTime;
        return head('When should your digest arrive?', 'Once a day, Halo asks you about the few updates that need a human. It takes about two minutes.') +
          '<div class="ob-times">' + [['12:00', '12:00 PM', 'Midday'], ['16:30', '4:30 PM', 'End of day'], ['17:30', '5:30 PM', 'Before you log off']].map(function (x) {
            return '<button type="button" class="choice ob-time" aria-checked="' + (cur === x[0]) + '" data-action="ob-time" data-v="' + x[0] + '"><span class="t-title-2 num">' + x[1] + '</span><span class="t-callout c-3">' + x[2] + (x[0] === '16:30' ? ' · recommended' : '') + '</span></button>';
          }).join('') + '</div>' +
          '<div class="group-title mt-6">Tell me when it’s ready</div><div class="group">' +
            '<div class="item"><span class="grow item-title">In Halo</span>' + ui.switch(true, 'noop', { disabled: true, 'aria-label': 'In Halo, always on' }) + '</div>' +
            '<div class="item"><span class="grow item-title">Push notification</span>' + ui.switch(s.prefs.notify.push, 'ob-notify', { 'data-k': 'push', 'aria-label': 'Push' }) + '</div>' +
            '<div class="item"><span class="grow item-title">Email</span>' + ui.switch(s.prefs.notify.email, 'ob-notify', { 'data-k': 'email', 'aria-label': 'Email' }) + '</div></div>';
      case 'warmup':
        var tasks = [['gcal', 'Reading this week’s calendar'], ['figma', 'Looking at your Figma files'], ['jira', 'Matching Jira tickets to your work'], ['github', 'Linking pull requests'], ['slack', 'Learning your voice from samples you chose']];
        var done = view.warm >= tasks.length;
        return '<div class="ob-warm">' + (done ? '<div class="ob-warm-ic done">' + H.icon('check', 28) + '</div>' : '<div class="ob-warm-ic"><span class="ob-spin">' + ui.mark(40) + '</span></div>') +
          '<h1 class="ob-h1">' + (done ? 'Your first digest is ready' : 'Halo is getting to know your work') + '</h1>' +
          '<p class="ob-sub">' + (done ? 'Here’s what Halo drafted from today. Routine updates are shared for you; the rest wait for a quick decision.' : 'This takes a few seconds. Nothing is shared yet.') + '</p>' +
          '<div class="group ob-tasks">' + tasks.map(function (x, i) {
            var st = i < view.warm ? 'done' : i === view.warm ? 'busy' : 'todo';
            return '<div class="item has-lead ' + st + '">' + H.brandTile(x[0], 28) + '<span class="grow item-title" style="font-weight:400">' + x[1] + '</span>' + (st === 'done' ? '<span class="ob-ok">' + H.icon('check', 14) + '</span>' : st === 'busy' ? '<span class="ob-dots"><i></i><i></i><i></i></span>' : '') + '</div>';
          }).join('') + '</div>' +
          (done ? '<div class="ob-sum"><div><span class="stat-num">12</span><span class="stat-label">Updates drafted</span></div><div><span class="stat-num">8</span><span class="stat-label">Routine, shared for you</span></div><div><span class="stat-num c-accent">4</span><span class="stat-label">Need you</span></div></div>' : '') + '</div>';
    }
    return '';
  }
  function head(t, sub) { return '<h1 class="ob-h1">' + esc(t) + '</h1><p class="ob-sub">' + esc(sub) + '</p>'; }
  function runWarm() {
    if (view.warmTimer) return;
    view.warm = 0;
    view.warmTimer = setInterval(function () {
      if (H.route.name !== 'onboarding' || H.route.parts[0] !== 'warmup') { clearInterval(view.warmTimer); view.warmTimer = null; return; }
      view.warm++; H.render(); if (view.warm >= 5) { clearInterval(view.warmTimer); view.warmTimer = null; }
    }, reduced() ? 150 : 720);
  }
  function go(step) { H.go('#/onboarding/' + step); }
  function next() {
    var i = STEPS.indexOf(H.route.parts[0] || 'workspace');
    if (i < STEPS.length - 1) go(STEPS[i + 1]); else finish();
  }
  function finish() {
    H.store.commit(function (s) { s.session.onboarded = true; s.session.welcomeSeen = true; s.session.tourDone = false; });
    H.go('#/home');
    setTimeout(function () { if (H.tour) H.tour.start(); }, 650);
  }

  H.screens.onboarding = {
    title: 'Set up Halo', fullscreen: true, public: true, docTitle: function () { return 'Set up · Halo'; },
    render: function (r) {
      var step = STEPS.indexOf(r.parts[0]) >= 0 ? r.parts[0] : 'workspace', i = STEPS.indexOf(step);
      var last = step === 'warmup', ready = last && view.warm >= 5;
      var cta = { workspace: 'Join workspace', role: 'Continue', sources: 'Continue', trust: 'Use ' + H.store.state.prefs.mode.charAt(0).toUpperCase() + H.store.state.prefs.mode.slice(1), voice: 'Continue', boundaries: 'Continue', digest: 'Finish setup', warmup: 'Open Halo' }[step];
      return '<div class="ob"><header class="ob-top"><a href="#/welcome" data-nav="#/welcome" class="ob-home" aria-label="Halo home page">' + lockup(18) + '</a>' + '<div class="ob-prog" role="progressbar" aria-valuemin="1" aria-valuemax="' + STEPS.length + '" aria-valuenow="' + (i + 1) + '">' + STEPS.map(function (x, j) { return '<i class="' + (j < i ? 'done' : j === i ? 'now' : '') + '"></i>'; }).join('') + '</div>' +
        '<span class="t-caption c-3 nowrap">Step ' + (i + 1) + ' of ' + STEPS.length + '</span></header>' +
        '<main class="ob-main"><div class="ob-body" data-key="ob-' + step + '">' + stepBody(step) + '</div></main>' +
        '<footer class="ob-foot"><div class="ob-foot-in">' + (i > 0 && !last ? ui.btn('Back', { kind: 'ghost', icon: 'arrow-left', action: 'ob-back' }) : '<span></span>') + '<span class="grow"></span>' +
          (['sources', 'voice', 'boundaries'].indexOf(step) >= 0 ? ui.btn('Skip for now', { kind: 'ghost', action: 'ob-next' }) : '') +
          ui.btn(cta, { kind: 'primary', size: 'lg', action: 'ob-next', disabled: last && !ready, trail: last ? '' : H.icon('arrow-right', 16), attrs: { id: 'ob-cta' } }) + '</div></footer></div>';
    },
    after: function (root, r) { if (r.parts[0] === 'warmup' && view.warm < 5) runWarm(); },
    keys: { Enter: function () { var b = document.getElementById('ob-cta'); if (b && !b.disabled) next(); } },
    actions: {
      'ob-next': function () { next(); },
      'ob-back': function () { var i = STEPS.indexOf(H.route.parts[0]); go(STEPS[Math.max(0, i - 1)]); },
      'ob-role': function (el) { view.role = el.dataset.v; H.render(); },
      'ob-team': function (el) { view.team = el.value; },
      'ob-connect': function (el) { connect(el.dataset.id); },
      'ob-connect-all': function () { REC.forEach(function (id, i) { setTimeout(function () { connect(id); }, i * 160); }); },
      'ob-mode': function (el) { H.act.setMode(el.dataset.v, true); },
      'ob-sample': function (el) { var k = el.dataset.v; view.samples[k] = !view.samples[k]; H.render(); },
      'ob-tone': function (el) { H.store.state.voice.tone[el.dataset.k] = +el.value; H.store.save(); var p = document.getElementById('ob-prev'); if (p) p.textContent = voicePreview(); },
      'ob-topic': function (el) { var id = el.dataset.id; H.store.commit(function (s) { s.privacy.topics.forEach(function (t) { if (t.id === id) t.on = !t.on; }); }); },
      'ob-time': function (el) { var v = el.dataset.v; H.store.commit(function (s) { s.prefs.digestTime = v; s.digest.closesAt = H.slot(0, v); }); },
      'ob-notify': function (el) { var k = el.dataset.k; H.store.commit(function (s) { s.prefs.notify[k] = !s.prefs.notify[k]; }); },
      'noop': function () { }
    }
  };
  function connect(id) {
    var s = H.store.state.sources[id]; if (!s || s.status === 'connected' || view.conn[id]) return;
    view.conn[id] = 'busy'; H.render();
    setTimeout(function () { view.conn[id] = null; H.store.commit(function (st) { st.sources[id].status = 'connected'; st.sources[id].error = null; st.sources[id].sync = 0; }); }, 650);
  }
})(window.H = window.H || {});

/* ---- js/screens/misc.js ---- */
/* Not found + small shared screens. */
(function (H) {
  'use strict';
  H.screens.notfound = {
    title: 'Not found',
    render: function (r) {
      return '<div class="empty" style="padding:96px 24px"><div class="empty-art">' + H.icon('compass', 28) + '</div><h3>This page doesn’t exist</h3>' +
        '<p>The link may be old, or the item was removed. Everything else in your Halo is where you left it.</p><div class="mt-4 row gap-2">' +
        H.ui.btn('Go back', { action: 'go-back' }) + H.ui.btn('Go to Home', { kind: 'primary', action: 'nav', attrs: { 'data-to': '#/home' } }) + '</div></div>';
    },
    actions: { 'go-back': function () { H.back('#/home'); } }
  };
})(window.H = window.H || {});

H.boot();
</script>
<script src="../../assets/js/return.js" defer></script>
</body>
