  --gfont:"Google Sans Flex","Google Sans","Roboto Flex",Roboto,"Helvetica Neue",Arial,sans-serif;--p:#8E1E1C;
  --bg:#FFF8F6;--ink:#231918;--muted:#5A4644;--line:#F0E0DD;--outline:#D8C2BF;--t1:#FFDAD5;--ont1:#5C0E0B;--t2:#FFDCC2;--ont2:#3A1C00;--surface:#fff;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120C0B;--ink:#F5ECEA;--muted:#D8C2BF;--line:#2E2321;--outline:#534341;--t1:#5C1D18;--ont1:#FFDAD5;--t2:#5A3416;--ont2:#FFDCC2;--surface:#1A1312;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120C0B;--ink:#F5ECEA;--muted:#D8C2BF;--line:#2E2321;--outline:#534341;--t1:#5C1D18;--ont1:#FFDAD5;--t2:#5A3416;--ont2:#FFDCC2;--surface:#1A1312;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gfont);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:3px;border-radius:10px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:64px;display:flex;align-items:center;gap:12px;padding:0 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;text-decoration:none;color:inherit}
.sp{flex:1}
.lnk{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 14px 6px 6px;border-radius:20px}
.lnk:hover{background:var(--t1);color:var(--ont1)}
.seg{display:inline-flex;height:38px;border-radius:19px;box-shadow:inset 0 0 0 1px var(--outline);overflow:hidden}
.seg button{border:0;background:none;padding:0 13px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button+button{box-shadow:inset 1px 0 0 var(--outline)}
.seg button[aria-pressed="true"]{background:var(--t2);color:var(--ont2)}
.stage{display:grid;grid-template-columns:250px auto 300px;gap:48px;justify-content:center;align-items:center;min-height:calc(100dvh - 64px);padding:20px}
.rail h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px}
.fl{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:20px;font-size:15px;font-weight:500;margin-bottom:4px}
.fl:hover{background:var(--surface)}
.fl.cur{background:var(--t1);color:var(--ont1)}
.note{background:var(--surface);border-radius:28px;padding:22px;box-shadow:0 1px 0 var(--line)}
.note small{font-size:13px;font-weight:600;color:var(--muted)}
.note b{display:block;font-size:21px;font-weight:500;margin:8px 0 6px;letter-spacing:-.015em}
.note p{margin:0;font-size:15px;line-height:1.55;color:var(--muted)}
#devWrap{position:relative}
@media (max-width:1180px){.stage{grid-template-columns:230px auto}.note{display:none}}
@media (max-width:860px){.rail{display:none}.stage{grid-template-columns:auto}}
body.frameless .stage{padding:0;min-height:0;display:block}
body.frameless #devWrap{width:100%!important;height:calc(100dvh - 64px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))!important}
body.frameless .dev{width:100%;height:100%;padding:0;border-radius:0;box-shadow:none;transform:none;background:var(--bg)}
body.frameless .dev::before,body.frameless .dev::after{display:none}
body.frameless .scrn{width:100%;height:100%;border-radius:0}
body.frameless .cam,body.frameless .sbar,body.frameless .gest{display:none}
body.frameless .tb{padding-top:6px}
body.frameless .vid > div[style*="top:44px"]{top:10px!important}
body.frameless .lock .clk{margin-top:40px}
body.frameless .brand span:last-child{display:none}
/* ================= ARRIBA PERÚ APP v2 — Material 3 expressive ================= */
.dev{width:392px;height:850px;transform:scale(var(--s,1));transform-origin:top left;border-radius:54px;padding:10px;position:relative;
  background:linear-gradient(145deg,#3b3d42,#16171a 30%,#0e0f11 70%,#2c2e33);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),0 50px 100px rgba(60,20,16,.22),0 18px 40px rgba(0,0,0,.18)}
.dev::before{content:"";position:absolute;right:-3px;top:180px;width:3px;height:70px;border-radius:0 2px 2px 0;background:#2a2b2f}
.dev::after{content:"";position:absolute;right:-3px;top:270px;width:3px;height:110px;border-radius:0 2px 2px 0;background:#2a2b2f}
.scrn{--p:#8E1E1C;--onp:#fff;--pc:#FFDAD5;--onpc:#5C0E0B;--sc:#FFDCC2;--onsc:#3A1C00;--sf:#FFF8F6;--sf0:#FFFFFF;--sf1:#FFF0EE;--sf2:#FCEAE7;--sf3:#F6E3E0;--sf4:#F0DDDA;
  --on:#231918;--onv:#5A4644;--ol:#857371;--olv:#E2CFCC;--err:#BA1A1A;--errc:#FFDAD6;--ok:#1E7B34;--okc:#CDEFD3;--warn:#7A5600;--warnc:#FFE6A3;--info:#1F4E85;--infoc:#D6E6FA;--yape:#7042C7;--yapec:#EADDFF;--sos:#E3241B;
  --gf:"Google Sans Flex","Google Sans","Roboto Flex",Roboto,"Helvetica Neue",Arial,sans-serif;
  position:relative;width:372px;height:830px;border-radius:44px;overflow:hidden;background:var(--sf);color:var(--on);font-family:var(--gf);font-size:15px;line-height:1.4;isolation:isolate;-webkit-font-smoothing:antialiased;text-align:left}
.scrn *,.scrn *::before,.scrn *::after{box-sizing:border-box}
:where(.scrn) button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:where(.scrn) img{display:block;max-width:100%}
.cam{position:absolute;top:13px;left:50%;width:13px;height:13px;border-radius:50%;background:#0a0a0b;box-shadow:0 0 0 2px #1c1c1f;transform:translateX(-50%);z-index:80}
.sbar{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 28px;font-size:14px;font-weight:500;z-index:75;color:var(--sbc,#231918);pointer-events:none;letter-spacing:.01em}
.sbar .ics{display:flex;gap:6px;align-items:center}
.gest{position:absolute;left:50%;bottom:7px;width:110px;height:4px;border-radius:2px;background:var(--gc,rgba(35,25,24,.55));transform:translateX(-50%);z-index:76;pointer-events:none}
#app,.app-static{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--sf);overflow:hidden}
.scr.in-fwd{animation:mFwd .38s cubic-bezier(.2,.9,.25,1)}
.scr.in-back{animation:mBack .38s cubic-bezier(.2,.9,.25,1)}
.scr.in-fade{animation:mFade .3s ease}
@keyframes mFwd{from{transform:translateX(18%);opacity:0}to{transform:none;opacity:1}}
@keyframes mBack{from{transform:translateX(-14%);opacity:0}to{transform:none;opacity:1}}
@keyframes mFade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scr.in-fwd,.scr.in-back,.scr.in-fade{animation:none}}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;padding:0 16px 24px}
.body::-webkit-scrollbar{display:none}
.body.np{padding:0}
/* top app bar */
.tb{flex:none;padding:40px 4px 0;background:var(--tbbg,var(--sf));position:relative;z-index:5}
.tb-row{height:60px;display:flex;align-items:center;gap:2px;padding:0 4px}
.tb-t{flex:1;font-size:20px;font-weight:500;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.tb-a{display:flex;gap:2px}
.tb-h{margin:2px 16px 0;font-size:32px;line-height:1.12;font-weight:500;letter-spacing:-.02em}
.tb-s{margin:6px 16px 14px;font-size:15px;color:var(--onv)}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--on);flex:none}
.ib:hover{background:rgba(35,25,24,.06)}
.ib.ton{background:var(--sf3)}
.ib.onp{color:#fff}
.ib.onp:hover{background:rgba(255,255,255,.12)}
.ib.exit{background:var(--on);color:var(--sf);width:40px;height:40px;margin:4px}
.bdg{position:absolute;top:8px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;font-style:normal}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--sc);color:var(--onsc);display:grid;place-items:center;font-weight:600;font-size:15px;flex:none}
/* bottom nav */
.nb{flex:none;height:92px;background:var(--sf2);display:grid;grid-template-columns:repeat(5,1fr);padding:12px 4px 22px}
.nb-i{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--onv);font-size:12px;font-weight:500}
.nb-p{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s}
.nb-i.on{color:var(--on);font-weight:700}
.nb-i.on .nb-p{background:var(--pc);color:var(--onpc)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:24px;font-size:15px;font-weight:500;letter-spacing:.005em;white-space:nowrap;transition:filter .2s,background .2s}
.btn.fill{background:var(--p);color:var(--onp)}
.btn.ton{background:var(--pc);color:var(--onpc)}
.btn.sec{background:var(--sc);color:var(--onsc)}
.btn.out{box-shadow:inset 0 0 0 1px var(--ol);color:var(--p)}
.btn.txt{color:var(--p);padding:0 14px}
.btn.err{background:var(--sos);color:#fff}
.btn.errt{background:var(--errc);color:#8C1111}
.btn.okb{background:var(--ok);color:#fff}
.btn.wide{width:100%}
.btn.lg{height:56px;border-radius:28px;font-size:16px}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px;border-radius:18px}
.btn:disabled,.btn[disabled]{background:rgba(35,25,24,.1)!important;color:rgba(35,25,24,.38)!important;box-shadow:none!important}
.fab{position:absolute;right:16px;bottom:108px;height:56px;padding:0 20px 0 16px;border-radius:18px;background:var(--pc);color:var(--onpc);display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;box-shadow:0 4px 10px rgba(80,20,16,.18),0 1px 3px rgba(0,0,0,.12);z-index:6}
.fab.np{bottom:24px}
.fab.round{width:56px;padding:0;justify-content:center}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--olv);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--onv);background:var(--sf0)}
.chip.on{background:var(--sc);color:var(--onsc);box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--okc);color:#0F4D1F}.t-warn{background:var(--warnc);color:#5A3F00}.t-err{background:var(--errc);color:#8C1111}.t-info{background:var(--infoc);color:var(--info)}.t-neu{background:var(--sf3);color:var(--onv)}.t-yape{background:var(--yapec);color:#4B2397}.t-p{background:var(--pc);color:var(--onpc)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* cards / lists */
.card{background:var(--sf0);border-radius:24px;padding:16px;box-shadow:0 1px 2px rgba(60,20,16,.06),0 1px 3px rgba(60,20,16,.05)}
.card.f{background:var(--sf2);box-shadow:none}
.card.o{background:var(--sf0);box-shadow:inset 0 0 0 1px var(--olv)}
.card + .card{margin-top:12px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-size:16px;font-weight:600;letter-spacing:-.005em}
.sh .btn{margin-right:-8px}
.li{display:flex;align-items:center;gap:14px;padding:12px 4px;width:100%;text-align:left;border-radius:16px;min-height:64px}
button.li:hover{background:rgba(35,25,24,.04)}
.li .lt{flex:1;min-width:0}
.li .h{font-size:15.5px;font-weight:500;line-height:1.3;display:block}
.li .s{font-size:13px;color:var(--onv);line-height:1.35;display:block;margin-top:2px}
.li .tr{color:var(--onv);flex:none;display:flex;align-items:center;gap:6px;font-size:13px}
.li .th{width:84px;height:62px;border-radius:16px;object-fit:cover;flex:none;background:var(--sf2)}
.li .thc{width:84px;height:62px;border-radius:16px;flex:none;object-fit:contain;background:var(--sf1)}
.div{height:1px;background:var(--olv);margin:2px 4px}
.shp{position:relative;display:inline-grid;place-items:center;flex:none}
.shp > svg{position:absolute;inset:0;width:100%;height:100%}
.shp .si{position:relative;display:grid;place-items:center}
/* switch */
.sw{width:52px;height:32px;border-radius:16px;background:var(--sf4);box-shadow:inset 0 0 0 2px var(--ol);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--ol);transition:all .2s}
.sw.on{background:var(--p);box-shadow:none}
.sw.on::after{left:24px;top:4px;width:24px;height:24px;background:#fff}
.seg{display:inline-flex;border-radius:20px;box-shadow:inset 0 0 0 1px var(--ol);overflow:hidden;height:40px}
.seg button{padding:0 16px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.seg button + button{box-shadow:inset 1px 0 0 var(--ol)}
.seg button.on{background:var(--sc);color:var(--onsc)}
/* progress */
.prog{height:4px;border-radius:2px;background:var(--sf4);margin:0 16px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:2px;background:var(--p);transition:width .5s cubic-bezier(.2,.8,.2,1)}
/* search */
.sbx{display:flex;align-items:center;gap:10px;height:56px;border-radius:28px;background:var(--sf3);padding:0 8px 0 18px;color:var(--onv);margin:4px 0 12px}
.sbx input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--on);min-width:0}
.sbx input::placeholder{color:var(--onv)}
/* text field */
.tf{position:relative;border-radius:12px;box-shadow:inset 0 0 0 2px var(--p);padding:22px 16px 10px;margin:18px 0 8px;font-size:22px;font-weight:500;letter-spacing:.04em;min-height:64px;display:flex;gap:10px;align-items:center}
.tf label{position:absolute;top:-9px;left:12px;background:var(--sf);padding:0 4px;font-size:12px;letter-spacing:0;color:var(--p);font-weight:500}
.tf .pre{color:var(--onv);font-size:18px}
.tf .ph{color:var(--olv)}
/* keypad */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px 0;flex:none}
.kp button{height:54px;border-radius:27px;background:var(--sf2);font-size:24px;font-weight:500;color:var(--on)}
.kp button:active{background:var(--sf4)}
.kp .blank{background:none;pointer-events:none}
.kp .del{background:none}
.dots{display:flex;gap:18px;justify-content:center;margin:24px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--p);transition:transform .2s}
.dots i.f{background:var(--p);transform:scale(1.08)}
.dots.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.foot{flex:none;padding:12px 16px 30px;display:flex;flex-direction:column;gap:8px;background:var(--sf)}
/* overlays */
.ov{position:absolute;inset:0;z-index:70;display:none}
.ov.on{display:block}
.ov .scrim{position:absolute;inset:0;background:rgba(35,25,24,.32);animation:mFade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sf1);border-radius:28px 28px 0 0;padding:10px 20px 32px;max-height:88%;overflow-y:auto;scrollbar-width:none;animation:shUp .38s cubic-bezier(.2,.9,.25,1)}
.sheet::-webkit-scrollbar{display:none}
@keyframes shUp{from{transform:translateY(100%)}}
.handle{width:32px;height:4px;border-radius:2px;background:var(--ol);opacity:.5;margin:6px auto 18px}
.sheet h3,.dlg h3{margin:0 0 8px;font-size:22px;font-weight:500;line-height:1.25;letter-spacing:-.01em}
.dlg{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--sf2);border-radius:28px;padding:24px;animation:dlgIn .3s cubic-bezier(.2,.9,.25,1);max-height:86%;overflow:auto}
@keyframes dlgIn{from{opacity:0;transform:translateY(-50%) scale(.9)}}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.sheet:focus,.dlg:focus{outline:none}
.snack{position:absolute;left:16px;right:16px;bottom:104px;z-index:90;background:#372E2C;color:#FBEEEB;border-radius:8px;min-height:48px;padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:snk .3s cubic-bezier(.2,.9,.25,1)}
.snack.np{bottom:28px}
.snack button{margin-left:auto;color:#FFB4A9;font-weight:600}
@keyframes snk{from{opacity:0;transform:translateY(16px)}}
/* misc */
.hero-card{border-radius:28px;padding:18px;color:#fff;background:var(--p) var(--patr) -40px -40px/520px auto;position:relative;overflow:hidden}
.hero-card .lb{font-size:13px;opacity:.85}
.hero-card .big{font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin:2px 0 10px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 12px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;border-radius:20px;font-size:12px;color:var(--onv);font-weight:500}
.wkd b{font-size:18px;font-weight:500;color:var(--on)}
.wkd.sel{background:var(--p);color:#FFDAD5}
.wkd.sel b{color:#fff}
.wkd .wd{width:5px;height:5px;border-radius:50%;background:var(--ol);margin-top:3px;opacity:0}
.wkd .wd.on{opacity:1}
.wkd.sel .wd{background:#fff}
.shift{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--sf0);box-shadow:0 1px 2px rgba(60,20,16,.06)}
.shift .bar{width:6px;align-self:stretch;border-radius:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:24px;padding:14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-weight:600;font-size:15px;line-height:1.2;color:#231918}
.carousel{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory}
.carousel::-webkit-scrollbar{display:none}
.carousel > *{scroll-snap-align:start;flex:none}
.sos-card{border-radius:28px;background:var(--errc);padding:16px;margin-top:18px}
.sos-card b{display:block;font-size:16px;color:#8C1111}
.sos-card span{font-size:13px;color:#7A2A24}
.slider{position:relative;height:60px;border-radius:30px;background:var(--sos);margin-top:12px;color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.slider .sf{position:absolute;left:0;top:0;bottom:0;background:#B71C1C;width:0}
.slider .st{position:relative;padding-left:36px}
.slider .knob{position:absolute;left:5px;top:5px;width:50px;height:50px;border-radius:50%;background:#fff;color:var(--sos);display:grid;place-items:center;cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.jcard{display:flex;gap:12px;padding:12px;border-radius:24px;background:var(--sf0);box-shadow:0 1px 2px rgba(60,20,16,.06),0 1px 3px rgba(60,20,16,.05);width:100%;text-align:left;margin-bottom:10px;cursor:pointer}
.jcard .ph{width:88px;height:96px;border-radius:18px;overflow:hidden;flex:none;background:var(--sf2);display:grid;place-items:center;color:var(--ol)}
.jcard .ph img{width:100%;height:100%;object-fit:cover}
.jcard .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.jcard .nm{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:-.005em}
.jcard .mt{font-size:12.5px;color:var(--onv)}
.jcard .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.jcard .pay{font-size:15px;font-weight:600}
.jcard .pay small{font-weight:400;color:var(--onv);font-size:12.5px}
.jcard .act{display:flex;flex-direction:column;justify-content:space-between;align-items:center;margin:-4px -4px -4px 0}
.cover{height:236px;position:relative;flex:none;background:var(--sf3)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent 40%,transparent 60%,rgba(255,248,246,.0))}
.cover .ctl{position:absolute;top:42px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:2}
.cover .ctl .ib{background:rgba(255,248,246,.92);width:44px;height:44px}
.gauge{height:12px;border-radius:6px;background:linear-gradient(90deg,#E3483A,#F2B33D 50%,#3FA34D);position:relative;margin:16px 0 8px}
.gauge i{position:absolute;top:-6px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--on),0 2px 6px rgba(0,0,0,.2);transform:translateX(-12px)}
.gl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--onv)}
.wg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wg .d{text-align:center;font-size:11px;color:var(--onv);font-weight:600;margin-bottom:4px}
.wg .c{display:flex;flex-direction:column;gap:3px;min-height:48px;border-radius:12px;padding:3px;background:var(--sf1)}
.wg .c span{background:var(--infoc);color:var(--info);border-radius:8px;font-size:9.5px;font-weight:600;text-align:center;padding:4px 1px;line-height:1.1}
.stickb{flex:none;padding:12px 16px 30px;background:linear-gradient(transparent,var(--sf) 30%)}
.bars3{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.bars3 div{display:grid;grid-template-columns:40px 1fr 26px;align-items:center;gap:10px;font-weight:600;font-size:13px}
.bars3 .tr2{height:10px;border-radius:5px;background:var(--sf3);overflow:hidden}
.bars3 .tr2 i{display:block;height:100%;border-radius:5px}
.face{border-radius:30%;display:grid;place-items:center}
/* learn */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bento .tile{min-height:132px}
.bento .tile:first-child{grid-column:span 2;min-height:120px;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px}
.lesson{border-radius:28px;background:var(--sf2);padding:16px;margin-top:12px;display:flex;gap:14px;align-items:center}
.lesson img{width:104px;height:84px;object-fit:cover;border-radius:20px;flex:none}
.lesson .q{font-size:17px;font-weight:600;margin-bottom:4px}
.lesson p{margin:0;font-size:13.5px;color:var(--onv);line-height:1.4}
.ex{margin-top:10px;border-radius:16px;background:var(--sf0);padding:12px;font-size:13.5px;line-height:1.45}
.tbanner{border-radius:28px;padding:18px;margin:4px 0 6px;display:flex;align-items:center;gap:16px}
.tbanner b{font-size:22px;font-weight:600;display:block;line-height:1.2;letter-spacing:-.01em}
.tbanner span{font-size:13.5px;opacity:.85}
.tp-hero{border-radius:28px;display:grid;place-items:center;padding:16px;margin-top:4px}
.tp-hero img{max-height:150px;width:auto;border-radius:20px}
.tp-h{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:18px 4px 4px}
.tp-s{font-size:14.5px;color:var(--onv);margin:0 4px 12px}
.blk{border-radius:24px;padding:16px;margin-top:10px}
.blk .k{font-size:12.5px;font-weight:600;color:var(--onv);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.blk p{margin:0;font-size:15px;line-height:1.5}
.uses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.uses div{border-radius:20px;background:var(--sf0);padding:12px 8px;text-align:center;font-size:12px;line-height:1.3;color:var(--onv);display:flex;flex-direction:column;align-items:center;gap:6px}
.uses div b{color:var(--on);font-size:13px;font-weight:600}
.uses img{width:100%;height:62px;object-fit:cover;border-radius:14px}
.src{font-size:11.5px;color:var(--onv);margin:16px 4px 90px}
.exg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.exg div{border-radius:20px;background:var(--sf0);padding:10px;text-align:center;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.exg img{width:100%;height:84px;object-fit:contain}
.flash{height:240px;border-radius:32px;perspective:900px;margin:12px 0;width:100%}
.flash .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .fa,.flash .fb{position:absolute;inset:0;border-radius:32px;backface-visibility:hidden;display:grid;place-items:center;padding:24px;text-align:center}
.flash .fa{background:#FBD6EC;color:#6E1D4B;font-size:32px;font-weight:600;letter-spacing:-.02em}
.flash .fb{background:#86245C;color:#fff;font-size:19px;line-height:1.4;transform:rotateY(180deg)}
.qopt{display:flex;align-items:center;gap:12px;width:100%;border-radius:20px;background:var(--sf0);box-shadow:inset 0 0 0 1px var(--olv);padding:16px;font-size:16px;font-weight:500;margin-bottom:8px;text-align:left}
.qopt .rd{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ol);flex:none}
.qopt.right{background:var(--okc);box-shadow:none}.qopt.right .rd{box-shadow:inset 0 0 0 6px var(--ok)}
.qopt.wrong{background:var(--errc);box-shadow:none}.qopt.wrong .rd{box-shadow:inset 0 0 0 6px var(--err)}
/* report */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.ropt{border-radius:24px;background:var(--sf0);box-shadow:inset 0 0 0 1px var(--olv);padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;font-weight:600;line-height:1.25;text-align:left;min-height:108px;position:relative}
.ropt.sel{background:var(--pc);box-shadow:inset 0 0 0 2px var(--p);color:var(--onpc)}
.ropt .ck{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--p);color:#fff;display:none;place-items:center}
.ropt.sel .ck{display:grid}
.vnote{display:flex;align-items:center;gap:12px;width:100%;border-radius:20px;padding:14px;background:var(--sf2);font-weight:600;font-size:14px}
.vnote.rec{background:var(--errc);color:#8C1111}
.vnote.ok{background:var(--okc);color:#0F4D1F}
.recd{width:10px;height:10px;border-radius:50%;background:var(--sos);animation:blk 1s infinite}
@keyframes blk{50%{opacity:.2}}
.ag{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ag span{border-radius:12px;background:var(--sf0);box-shadow:inset 0 0 0 1px var(--olv);padding:8px 12px;font-size:13px;font-weight:600;line-height:1.2}
.ag span small{display:block;font-weight:400;color:var(--onv);font-size:11.5px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:30px}
.done h2{font-size:26px;font-weight:500;margin:20px 0 6px;letter-spacing:-.015em}
.casebox{border-radius:20px;background:var(--sf2);padding:14px 18px;margin:16px 0;width:100%}
.casebox b{font-size:22px;letter-spacing:.06em;font-family:ui-monospace,Menlo,monospace}
.nl{list-style:none;padding:0;margin:0;width:100%;text-align:left;counter-reset:n}
.nl li{counter-increment:n;display:flex;gap:12px;align-items:center;padding:10px 0;font-size:14.5px}
.nl li::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:var(--pc);color:var(--onpc);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
/* sos */
.sosbg{background:#B3160F;color:#fff}
.ring{width:200px;height:200px;margin:80px auto 24px;display:grid;place-items:center;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-size:80px;font-weight:400}
.callrow{display:flex;align-items:center;gap:14px;width:100%;border-radius:20px;background:rgba(255,255,255,.12);padding:14px;margin-bottom:8px;color:#fff;text-align:left;font-weight:600;font-size:15px}
.callrow .ci{width:40px;height:40px;border-radius:50%;background:#fff;color:#B3160F;display:grid;place-items:center;flex:none}
.callrow small{display:block;font-weight:400;opacity:.8;font-size:12.5px}
/* wallet */
.bal{border-radius:28px;padding:18px;background:var(--p) var(--patr) -40px -20px/520px auto;color:#fff}
.bal .row{display:flex;justify-content:space-between;align-items:flex-start}
.bal .big{font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.ypb{width:38px;height:38px;border-radius:12px;background:var(--yape,#7042C7);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:-.02em;flex:none}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px;margin-top:16px}
.chart div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;color:rgba(255,255,255,.75)}
.chart i{width:100%;border-radius:8px;background:rgba(255,255,255,.9);transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.chart i.pend{background:transparent;box-shadow:inset 0 0 0 2px #FFB4A9;background-image:repeating-linear-gradient(45deg,rgba(255,180,169,.35) 0 4px,transparent 4px 8px)}
.chart i.zero{height:4px!important;background:rgba(255,255,255,.3)}
@keyframes grow{from{transform:scaleY(0)}}
.fav{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px;flex:none}
.amt{font-weight:600;font-size:15px;color:var(--ok)}
.amt.neg{color:var(--err)}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat2 div{border-radius:20px;background:var(--sf2);padding:14px}
.stat2 small{font-size:12px;color:var(--onv);display:block}
.stat2 b{font-size:24px;font-weight:500;letter-spacing:-.02em}
.amtd{font-size:44px;font-weight:400;text-align:center;margin:8px 0 6px;letter-spacing:-.02em}
.wapp{background:#DCF8C6;border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin:10px 0 18px;color:#111}
/* videos */
.vth{position:relative;border-radius:20px;overflow:hidden;display:grid;place-items:center;flex:none}
.vth .pat{position:absolute;inset:0;background:var(--patc) 0 0/260px auto;opacity:.14}
.vth .pl{position:absolute;left:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:#fff;color:#231918;display:grid;place-items:center;padding-left:2px}
.vth .du{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px}
.feat{display:block;width:100%;text-align:left;margin-bottom:6px}
.feat .vth{width:100%;height:188px;border-radius:28px}
.feat .vth .pl{width:48px;height:48px;left:16px;bottom:16px}
.feat b{display:block;font-size:17px;font-weight:600;margin:10px 4px 2px}
.feat small{display:block;color:var(--onv);font-size:13px;margin:0 4px}
.vid{flex:none;height:320px;position:relative;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 16px;overflow:hidden}
.vid .vpat{position:absolute;inset:0;background:var(--patc) 0 0/360px auto;opacity:.1}
.vid .vic{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:30px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.vid.aonly .vic{animation:pls 1.4s ease-in-out infinite}
@keyframes pls{50%{transform:translate(-50%,-50%) scale(1.08)}}
.vid .vt{position:relative;font-size:16px;font-weight:500;line-height:1.35;min-height:44px}
.vprog{position:relative;display:flex;gap:4px;margin-top:12px}
.vprog i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
.vprog i.d{background:#fff}
.vprog i.a::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:vfill var(--sd,5200ms) linear forwards}
.vid.paused .vprog i.a::after{animation-play-state:paused}
@keyframes vfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.vctl{position:relative;display:flex;align-items:center;gap:10px;margin-top:12px}
.vctl button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center}
.vctl .bigp{width:52px;height:52px;background:#fff;color:#231918}
.vctl small{margin-left:auto;font-size:12.5px;opacity:.85}
.steps button{display:flex;gap:12px;width:100%;text-align:left;padding:12px 4px;font-size:14.5px;line-height:1.4;color:var(--onv);align-items:flex-start;border-radius:14px}
.steps button.cur{color:var(--on);font-weight:600;background:var(--sf1)}
.steps .sn{width:28px;height:28px;border-radius:50%;background:var(--sf3);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.steps button.cur .sn{background:var(--p);color:#fff}
.steps button.dn .sn{background:var(--okc);color:var(--ok)}
/* profile */
.pfh{display:flex;flex-direction:column;align-items:center;padding:4px 0 6px;text-align:center}
.pfh .avatar{width:88px;height:88px;font-size:30px}
.pfh h2{margin:12px 0 8px;font-size:24px;font-weight:500}
/* onboarding */
.ob-art{flex:none;height:300px;position:relative;overflow:hidden;display:grid;place-items:center}
.ob-h{font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin:6px 4px 6px}
.ob-s{font-size:15px;color:var(--onv);margin:0 4px 6px;line-height:1.45}
.lang{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:20px;margin-bottom:8px;background:var(--sf0);box-shadow:inset 0 0 0 1px var(--olv);text-align:left;font-size:16px;font-weight:500}
.lang.sel{background:var(--pc);box-shadow:inset 0 0 0 2px var(--p);color:var(--onpc)}
.lang .rd{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ol);margin-left:auto;flex:none}
.lang.sel .rd{box-shadow:inset 0 0 0 6px var(--p)}
.lang[disabled]{opacity:.5;cursor:default}
.lang small{font-size:12px;color:var(--onv);font-weight:500;margin-left:auto}
.codebox{display:flex;gap:12px;justify-content:center;margin:24px 0 12px}
.codebox span{width:60px;height:68px;border-radius:16px;background:var(--sf2);display:grid;place-items:center;font-size:28px;font-weight:500;transition:all .2s}
.codebox span.f{background:var(--pc);color:var(--onpc);box-shadow:inset 0 0 0 2px var(--p)}
.cam2{margin:14px 0;height:210px;border-radius:28px;background:#1d1b1b;position:relative;overflow:hidden;display:grid;place-items:center}
.cam2 .br{position:absolute;width:34px;height:34px;border:3px solid #fff}
.cam2 .tl{top:20px;left:20px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}.cam2 .tr{top:20px;right:20px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}.cam2 .bl{bottom:20px;left:20px;border-right:0;border-top:0;border-radius:0 0 0 12px}.cam2 .brr{bottom:20px;right:20px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.cam2 .scan{position:absolute;left:24px;right:24px;height:2px;background:#FFB4A9;box-shadow:0 0 14px #FFB4A9;top:24px;animation:scn 1.4s ease-in-out infinite alternate}
@keyframes scn{to{top:184px}}
.dni{width:282px;height:178px;border-radius:14px;background:linear-gradient(135deg,#E9F1F7,#CFE0EC);color:#1d3348;padding:10px 12px;font-size:9px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.35);font-family:Arial,sans-serif;text-align:left}
.dni .hd{font-weight:700;font-size:8.5px;color:#24496b}
.dni .ph{position:absolute;left:12px;top:36px;width:62px;height:78px;border-radius:6px;background:#9fb5c6;display:grid;place-items:center;color:#e9f1f7}
.dni .tx{position:absolute;left:86px;top:38px;line-height:1.5}
.dni .tx b{font-size:11px;display:block}
.dni .num{position:absolute;right:12px;top:10px;font-size:12px;font-weight:700}
.dni .mrz{position:absolute;left:12px;right:12px;bottom:10px;font-family:ui-monospace,Menlo,monospace;font-size:8px;letter-spacing:.06em;color:#4b6378}
.acct{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:20px;background:var(--sf0);box-shadow:inset 0 0 0 1px var(--olv);margin-bottom:8px;text-align:left}
.acct.sel{box-shadow:inset 0 0 0 2px var(--yape);background:var(--yapec)}
/* lock */
.lock{background:radial-gradient(120% 80% at 30% 10%,#FFDAD5 0%,#E7A497 35%,#9E3A2E 70%,#5A1210 100%);color:#fff}
.lock .clk{margin:84px 0 0 28px;font-size:104px;font-weight:400;line-height:.9;letter-spacing:-.04em}
.lock .dt{margin:10px 0 0 30px;font-size:16px;font-weight:500;opacity:.92}
.nt{margin:26px 14px 0;border-radius:24px;background:rgba(255,248,246,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#231918;padding:14px;display:flex;gap:12px;width:calc(100% - 28px);text-align:left}
.nt .ni{width:36px;height:36px;border-radius:10px;background:var(--p) var(--patr) center/120px auto;display:grid;place-items:center;flex:none}
.nt b{font-size:13px;font-weight:500;color:var(--onv);display:flex;justify-content:space-between}
.nt span{display:block;font-size:15px;font-weight:500;margin-top:2px}
.lhint{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:13px;opacity:.9}
.blob{position:absolute;pointer-events:none}

.logo{display:inline-grid;place-items:center;flex:none;position:relative;z-index:2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 6px 16px rgba(92,14,11,.18)}

</style>

const NOTES = {
  splash:[["The condor","El cóndor"],["The mark joins the condor (strength, protection, presence) with Andean textile geometry that stands for community and shared knowledge. The red and white come from the flag.","La marca une al cóndor (fuerza, protección, presencia) con la geometría textil andina, que representa comunidad y saber compartido. El rojo y el blanco vienen de la bandera."]],
  onboard:[["Familiar before new","Primero lo conocido"],["Onboarding follows the flow of Yape, the payment app workers already trust: language, phone, DNI, then an optional Yape link. Each step has one input and can be read aloud.","El registro sigue el flujo de Yape, la app de pagos que ya conocen: idioma, celular, DNI y luego vincular Yape si quieren. Cada paso tiene un solo dato y se puede escuchar."]],
  pin:[["A key for shared phones","Una clave para celulares compartidos"],["Phones are often shared or seen by others. A 4-number key keeps rights content, reports and pay records private.","Los celulares a veces se comparten o los ven otras personas. Una clave de 4 números mantiene privados los derechos, los reportes y los pagos."]],
  home:[["Identity before marketplace","Primero la persona, después el mercado"],["Most gig apps open on a job feed. This one opens on the worker: their week, their four tools, and the emergency slider. Launch features are kept to four on purpose, so trust can grow before the app does.","Casi todas las apps de trabajo abren en una lista de ofertas. Esta abre en la persona: su semana, sus cuatro herramientas y el deslizador de emergencia. Son solo cuatro funciones al inicio a propósito, para que la confianza crezca antes que la app."]],
  jobs:[["Two graders, two questions","Dos calificaciones, dos preguntas"],["The colored dot answers “how does this family treat workers?” from anonymous, aggregated ratings. The pay tag answers “is this legal?” by comparing the offer to the minimum wage for those exact hours.","El punto de color responde “¿cómo trata esta familia a quienes trabajan ahí?” con opiniones anónimas y agrupadas. La etiqueta de pago responde “¿es legal?” comparando la oferta con el mínimo para esas horas."]],
  job:[["Accountability without exposure","Responsabilidad sin exponer a nadie"],["Families verify their identity with DNI and must list references. Ratings stay hidden until there are enough to protect whoever gave them, so early reviewers can’t be traced.","Las familias verifican su identidad con DNI y deben dar referencias. Las opiniones se ocultan hasta que hay suficientes para proteger a quien las dio, así nadie puede ser identificada."]],
  edu:[["From a maze to six doors","De un laberinto a seis puertas"],["The information already exists across MTPE and SUNAFIL, behind layers of links and legal language. The app doesn’t write new rules. It restructures what exists into six color-coded doors.","La información ya existe en el MTPE y SUNAFIL, detrás de capas de enlaces y lenguaje legal. La app no inventa reglas nuevas. Ordena lo que existe en seis puertas de colores."]],
  topic:[["Shown, then said","Primero se ve, luego se dice"],["Every topic follows the same three questions: what is it, how does it work, what is it for. Illustrations carry the meaning first, and Listen reads the screen aloud in Spanish or English.","Cada tema sigue las mismas tres preguntas: qué es, cómo funciona, para qué sirve. Las ilustraciones llevan el significado primero, y Escuchar lee la pantalla en español o inglés."]],
  sit:[["Discreet by design","Discreta por diseño"],["Sensitive sections ask before opening and offer a quick exit that jumps to a recipe video. Nothing on screen is labeled as a “report” where someone else could see it.","Las secciones sensibles preguntan antes de abrir y ofrecen una salida rápida que salta a un video de recetas. Nada en pantalla dice “denuncia” donde otra persona pueda verlo."]],
  report:[["One tap instead of a form","Un toque en vez de un formulario"],["Today, reporting means navigating government sites in legal language. Here the worker taps what happened, and their profile, workplace, DNI and location are filled in and routed to the right agency.","Hoy, reportar significa navegar sitios del gobierno en lenguaje legal. Aquí la persona toca lo que pasó, y su perfil, lugar de trabajo, DNI y ubicación se completan y se envían a la entidad correcta."]],
  sos:[["A deliberate action","Una acción a propósito"],["Modeled on safety apps like Noonlight and bSafe: one simple gesture shares location and profile. Sliding instead of tapping prevents accidental alerts, and a short countdown allows a cancel.","Inspirado en apps de seguridad como Noonlight y bSafe: un gesto simple comparte ubicación y perfil. Deslizar en vez de tocar evita alertas por accidente, y una cuenta regresiva permite cancelar."]],
  wallet:[["Every sol accounted for","Cada sol en su lugar"],["Pay in domestic work is informal and mixed. The wallet syncs Yape and lets workers log cash, then surfaces what’s owed, partial or late in red before it’s forgotten.","El pago en el trabajo del hogar es informal y mixto. La billetera sincroniza Yape y permite anotar efectivo, y marca en rojo lo que se debe, lo parcial o lo atrasado antes de que se olvide."]],
  tuts:[["Learning is shown, not explained","Se aprende viendo, no leyendo"],["Research showed workers learn by watching and repeating. Tutorials are short, step-based and recommended from current jobs, with an audio-only mode for working hands.","La investigación mostró que se aprende viendo y repitiendo. Los tutoriales son cortos, por pasos y recomendados según los trabajos actuales, con modo solo audio para cuando las manos están ocupadas."]],
  checkin:[["A quiet presence","Una presencia tranquila"],["Check-ins look like any friendly notification. They never ask for a response and never raise an alarm if an employer sees the screen. They can be turned off.","Los mensajes diarios parecen cualquier notificación amable. No piden respuesta y no levantan sospechas si un empleador ve la pantalla. Se pueden apagar."]],
  rating:[["No names, no text","Sin nombres, sin texto"],["Feedback is three faces. No writing, so literacy isn’t a barrier, and no free text, so nothing can be traced back. Answers only count once combined with others.","La opinión son tres caras. Sin escribir, para que leer no sea una barrera, y sin texto libre, para que nada se pueda rastrear. Las respuestas solo cuentan combinadas con otras."]],
  profile:[["The worker stays in control","Tú decides"],["Language, check-ins, trusted contact and the app key live in one place. Every safety feature can be turned on or off by the worker.","Idioma, mensajes diarios, contacto de confianza y la clave están en un solo lugar. Cada función de seguridad la activa o apaga quien usa la app."]],

}

function mountSlider(el, done) {
  const t = el.querySelector('#slide'); if (!t) return; const k = t.querySelector('.knob'), f = t.querySelector('.sf');
  let sx = 0, x = 0, drag = false; const max = () => t.clientWidth - 60; const scale = () => t.getBoundingClientRect().width / t.offsetWidth;
  const set = v => { x = Math.max(0, Math.min(max(), v)); k.style.left = 5 + x + 'px'; f.style.width = x + 30 + 'px'; k.setAttribute('aria-valuenow', Math.round(x / max() * 100)); };
  const end = () => { if (!drag) return; drag = false; k.style.transition = 'left .25s'; f.style.transition = 'width .25s'; if (x > max() * .86) { set(max()); later(done, 120); } else set(0); setTimeout(() => { k.style.transition = ''; f.style.transition = ''; }, 260); };
  k.addEventListener('pointerdown', e => { drag = true; sx = e.clientX; k.setPointerCapture(e.pointerId); });
  k.addEventListener('pointermove', e => { if (drag) set((e.clientX - sx) / scale()); });
  k.addEventListener('pointerup', end); k.addEventListener('pointercancel', end);
  k.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { set(x + max() / 4); if (x >= max()) later(done, 100); } if (e.key === 'ArrowLeft') set(x - max() / 4); });
}

function staticScreen(id, p = {}) { const sc = SCR[id]; return `<div class="app-static"><div class="scr ${sc.cls ? sc.cls(p) : ''}">${noIds(sc.render(p) + (sc.tab ? navBar(sc.tab) : ''))}</div></div>`; }
function phoneShell(inner, sb) { return `<div class="dev"><div class="scrn" style="--sbc:${sb === 'light' ? '#fff' : '#231918'};--gc:${sb === 'light' ? 'rgba(255,255,255,.7)' : 'rgba(35,25,24,.5)'}"><span class="cam"></span><div class="sbar"><span>9:41</span><span class="ics">${SBI}</span></div>${inner}<span class="gest"></span></div></div>`; }
const phoneOf = (id, p = {}) => phoneShell(staticScreen(id, p), SCR[id].sb);
</script>
<script>
const STORY_URL='index.html';
const K={story:["The story","La historia"],flows:["Try a flow","Prueba un recorrido"],why:["Why it works this way","Por qué funciona así"]};
const FLOWS=[['onb',["Sign up","Registrarse"],'user'],['jobs',["Find a safe job","Buscar trabajo seguro"],'brief'],['edu',["Know your rights","Conocer tus derechos"],'book'],['wallet',["Track every sol","Controlar cada sol"],'wallet'],['tuts',["Learn by video","Aprender con videos"],'video'],['help',["Get help, quietly","Pedir ayuda en silencio"],'shield'],['lock',["A check-in on the lock screen","Un mensaje en la pantalla bloqueada"],'bell'],['rate',["An anonymous rating","Una opinión anónima"],'heart']];
const FOF={splash:'onb',lang:'onb',phone:'onb',code:'onb',dni:'onb',yape:'onb',yapeAcct:'onb',pin:'onb',welcome:'onb',login:'onb',jobs:'jobs',job:'jobs',apps:'jobs',edu:'edu',cat:'edu',topic:'edu',rw:'edu',vocab:'edu',traps:'edu',practice:'edu',report:'help',sos:'help',wallet:'wallet',walletFam:'wallet',tuts:'tuts',player:'tuts',lock:'lock'};
function paintJump(){const c=FOF[S.cur];$$('.fl').forEach(b=>b.classList.toggle('cur',b.dataset.flow===c));}
function flow(k){stopSpeech();closeOvSilent();S.stack=[];
  if(k==='onb'){S.phone='';S.code='';S.pinTry='';S.langPick=null;show('splash',{},'fade');}
  else if(k==='help'){show('home',{},'fade');later(()=>{const b=$('#app .body');if(b)b.scrollTo({top:b.scrollHeight,behavior:'smooth'});},350);}
  else if(k==='rate'){show('home',{},'fade');rate();}
  else show(k,{},'fade');}
function setLang(l){L=l;try{localStorage.setItem('arriba-lang',l)}catch(e){}document.documentElement.lang=l;
  $$('[data-k]').forEach(e=>e.textContent=tr(K[e.dataset.k]));$$('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  $('#flows').innerHTML=FLOWS.map((f,i)=>`<button class="fl" data-flow="${f[0]}">${shp(['cookie9','circle','flower','cookie6','clover','cookie4','sunny','squircle'][i],['#FFDAD5','#FFDCC2','#D6E6FA','#EADDFF','#CDEFD3','#FFDAD6','#FFE6A3','#FBD6EC'][i],['#5C0E0B','#3A1C00','#1F4E85','#4B2397','#0F4D1F','#8C1111','#7A5600','#86245C'][i],40,f[2],19)}${tr(f[1])}</button>`).join('');
  paintJump(); if(S.cur){const o=$('#ov').classList.contains('on');refresh();if(o)closeOvSilent();}}
function fit(){const fr=innerWidth<=560;document.body.classList.toggle('frameless',fr);const w=$('#devWrap'),d=$('#device');
  if(fr){w.style.width='';w.style.height='';d.style.setProperty('--s',1);return;}
  const s=Math.max(.6,Math.min(1,(innerHeight-104)/850,(innerWidth-40)/392));w.style.width=392*s+'px';w.style.height=850*s+'px';d.style.setProperty('--s',s);}
document.addEventListener('DOMContentLoaded',()=>{
  $('#sbIcons').innerHTML=SBI;$$('.js-cond').forEach(e=>e.innerHTML=logo(36));$$('.js-story').forEach(a=>a.href=STORY_URL);$$('.js-back').forEach(e=>e.innerHTML=shp('stepd','var(--t1)','var(--ont1)',30,'back',15));
  $('#screen').addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act]');if(!t)return;if(t.dataset.act){const f=ACT[t.dataset.act];f&&f(t.dataset.arg,t,e);return;}if(t.dataset.go){closeOvSilent();go(t.dataset.go,t.dataset.p?JSON.parse(t.dataset.p):{});}});
  $('#screen').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.jcard')){e.preventDefault();e.target.click();}if(e.key==='Escape')closeOv();});
  document.addEventListener('click',e=>{const lb=e.target.closest('.seg button');if(lb&&!$('#screen').contains(lb)){setLang(lb.dataset.lang);return;}const fb=e.target.closest('[data-flow]');if(fb){flow(fb.dataset.flow);}});
  addEventListener('resize',fit);fit();setLang(L);show('splash',{},'none');});
</script>
